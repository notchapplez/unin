[package]
name = "unin-bin"
version = "0.1.3"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/notchapplez/unin"
description = "A universal installer for many languages so you don't have to remember any commands"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
dialoguer = "0.12.0"
libc = "0.2.184"
num_cpus = "1.17.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["default"] }
time = { version = "0.3.47", features = ["parsing", "macros", "formatting"] }
path-absolutize = "3.1.1"
rand = "0.10.1"
terminal_size = "0.4.4"
unicode-truncate = "2.0.1"
duct = "1.1.1"
unicode-segmentation = "1.13.2"
smallvec = "1.15.1"

[[bin]]
name = "unin"
path = "src/main.rs"
